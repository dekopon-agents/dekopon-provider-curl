[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# encoding_rs reaches this graph only through the native test harness: a dev-dependency on
# dekopon-broker-host turns on dekopon-provider-sdk's `host` feature, which pulls Wasmtime. It is
# absent from the shipped wasm32 normal/build graph, so it appears in neither
# security/wasm-dependencies.txt nor THIRD_PARTY_NOTICES.md. Named rather than allowed globally, so
# a BSD-3-Clause crate that did reach the shipped closure would still fail.
exceptions = [
  { name = "encoding_rs", allow = ["BSD-3-Clause"] },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
