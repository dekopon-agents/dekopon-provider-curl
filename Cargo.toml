[workspace]

[package]
name = "dekopon-curl-provider"
version = "0.4.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Bounded broker-authorized HTTP GET capability for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-curl"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
dekopon-provider-sdk = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-broker-host = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-broker = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-broker-protocol = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-capability = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
dekopon-core = { git = "https://github.com/dekopon-agents/dekopon", rev = "765d72149ab157e1095d3dad891bdd30d83c88cf" }
async-trait = "=0.1.92"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
