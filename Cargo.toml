[workspace]

[package]
name = "dekopon-curl-provider"
version = "0.5.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Bounded broker-authorized HTTP GET capability for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-curl"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
dekopon-provider-sdk = "=0.31.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.31.0"
dekopon-broker-host = "=0.31.0"
dekopon-broker = "=0.31.0"
dekopon-broker-protocol = "=0.31.0"
dekopon-capability = "=0.31.0"
dekopon-core = "=0.31.0"
async-trait = "=0.1.92"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
