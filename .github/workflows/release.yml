name: Release v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  MSRV: "1.89.0"
  RELEASE_RUST: "1.97.0"
  WASM_TOOLS_VERSION: "1.236.1"
  WASMTIME_VERSION: "48.0.0"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  ORAS_VERSION: "1.2.3"
  ORAS_LINUX_AMD64_SHA256: "b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827"
  OCI_REPOSITORY: "ghcr.io/dekopon-agents/provider-curl"
  PACKAGE_ENDPOINT: "orgs/dekopon-agents/packages/container/provider-curl"

jobs:
  build:
    name: Build and verify immutable bytes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - name: Check out the immutable tag without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact annotated v0.1.0 tag at current main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" == "v0.1.0" ]]
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$tag^{}")" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "dekopon-curl-provider") | .version')
          [[ "$tag" == "v$version" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]
          test -z "$(git ls-files '*.wasm' '*.wasm.sha256' 'dist/**' 'target/**')"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install exact MSRV, build, and verification tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$MSRV" --profile minimal \
            --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain "$MSRV"
          rustup toolchain install "$RELEASE_RUST" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$RELEASE_RUST"
          cargo "+$RELEASE_RUST" install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
          cargo "+$RELEASE_RUST" install wasmtime-cli \
            --version "$WASMTIME_VERSION" --locked
          cargo "+$RELEASE_RUST" install dekopon-run --version 0.11.1 --locked
          cargo "+$RELEASE_RUST" install cargo-deny \
            --version "$CARGO_DENY_VERSION" --locked
          cargo "+$RELEASE_RUST" install cargo-cyclonedx \
            --version "$CARGO_CYCLONEDX_VERSION" --locked

      - name: Run MSRV, source, dependency, workflow-source, and license gates
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$MSRV" fmt --all -- --check
          cargo "+$MSRV" clippy --locked --all-targets -- -D warnings
          cargo "+$MSRV" test --locked --lib
          cargo "+$MSRV" check --locked --target wasm32-unknown-unknown
          cargo deny --locked check advisories licenses bans sources
          ./scripts/dependency_inventory.py check-sources
          ./scripts/dependency_inventory.py inventory --output "$RUNNER_TEMP/dependencies.txt"
          ./scripts/dependency_inventory.py notices --output "$RUNNER_TEMP/notices.md"
          cmp security/wasm-dependencies.txt "$RUNNER_TEMP/dependencies.txt"
          cmp THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/notices.md"
          cargo tree --locked --target wasm32-unknown-unknown -e normal,build \
            --prefix none --format '{p}' >"$RUNNER_TEMP/cargo-tree.txt"
          python3 - "$RUNNER_TEMP/cargo-tree.txt" security/wasm-dependencies.txt <<'PY'
          import pathlib
          import re
          import sys

          tree = set()
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              match = re.match(r"(.+?) v([^ ]+)", line)
              if match and match.group(1) != "dekopon-curl-provider":
                  tree.add(match.groups())
          inventory = set()
          for line in pathlib.Path(sys.argv[2]).read_text().splitlines():
              if line and not line.startswith("#"):
                  name, version, _source = line.split(" ", 2)
                  inventory.add((name, version))
          if tree != inventory or len(tree) != 43:
              raise SystemExit("isolated inventory differs from cargo tree normal/build graph")
          PY
          test "$(grep -Evc '^#|^$' security/wasm-dependencies.txt)" -eq 43
          grep -Fq 'Unicode-3.0' THIRD_PARTY_NOTICES.md
          grep -Fq Zlib THIRD_PARTY_NOTICES.md
          grep -Fq 'LLVM-exception' THIRD_PARTY_NOTICES.md
          if grep -Eq 'source = "git\+|path\+' Cargo.lock; then
            echo "error: lockfile contains a Git or path source" >&2
            exit 1
          fi
          python3 -m py_compile scripts/dependency_inventory.py
          shellcheck build.sh scripts/*.sh

      - name: Build, inspect, execute through broker, and reject direct hosts
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh
          ./scripts/verify-component.sh
          cargo "+$RELEASE_RUST" test --locked --test broker_host -- --nocapture
          ./scripts/test-direct-refusal.sh

      - name: Generate and validate deterministic isolated-graph CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/generate-sbom.sh dist/curl-provider.cdx.json
          jq -e '
            .bomFormat == "CycloneDX" and
            .specVersion == "1.5" and
            .metadata.component.name == "dekopon-curl-provider" and
            (.components | length) == 43
          ' dist/curl-provider.cdx.json >/dev/null

      - name: Rebuild two independent clean git archives
        run: ./scripts/check-reproducible.sh

      - name: Stage exact release assets and record digest
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp curl-provider.wasm curl-provider.wasm.sha256 dist/release/
          test "$(find dist/release -maxdepth 1 -type f | wc -l)" -eq 2
          (cd dist/release && shasum -a 256 -c curl-provider.wasm.sha256)
          test "$(wc -c < dist/release/curl-provider.wasm)" -le $((512 * 1024))
          sha256=$(awk '{print $1}' dist/release/curl-provider.wasm.sha256)
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
          test -z "$(git ls-files '*.wasm' '*.wasm.sha256' 'dist/**' 'target/**')"
          git diff --exit-code

      - name: Upload exact release component assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-component
          path: |
            dist/release/curl-provider.wasm
            dist/release/curl-provider.wasm.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload attestation-only SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: dist/curl-provider.cdx.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest provenance and SBOM
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Required only for the two GitHub artifact attestations below.
      attestations: write # Required only for the two GitHub artifact attestations below.
    steps:
      - name: Download verified component
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-component
          path: dist
      - name: Download deterministic SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-sbom
          path: sbom
      - name: Verify attestation inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          (cd dist && shasum -a 256 -c curl-provider.wasm.sha256)
          jq -e '
            .bomFormat == "CycloneDX" and
            .specVersion == "1.5" and
            (.components | length) == 43
          ' sbom/curl-provider.cdx.json >/dev/null
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/curl-provider.wasm
      - name: Attest CycloneDX SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: dist/curl-provider.wasm
          sbom-path: sbom/curl-provider.cdx.json

  draft:
    name: Create one owned draft release
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Draft discovery, creation, asset upload, and deletion.
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      wasm_asset_id: ${{ steps.upload.outputs.wasm_asset_id }}
      checksum_asset_id: ${{ steps.upload.outputs.checksum_asset_id }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out for a fresh release-ref check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified component
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-component
          path: dist
      - name: Reverify tag, bytes, and absence of any existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "v0.1.0" ]]
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          (cd dist && shasum -a 256 -c curl-provider.wasm.sha256)
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/releases.json"
          count=$(jq --arg tag "$GITHUB_REF_NAME" \
            '[.[] | select(.tag_name == $tag)] | length' "$RUNNER_TEMP/releases.json")
          [[ "$count" == 0 ]] || {
            echo "error: refusing to reuse any existing release for $GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Create and capture this run's exact draft release ID
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$GITHUB_REF_NAME" \
            -F draft=true \
            -F prerelease=false \
            -F generate_release_notes=true >"$RUNNER_TEMP/created-release.json"
          release_id=$(jq -er --arg tag "$GITHUB_REF_NAME" '
            select(.tag_name == $tag and .draft == true and .prerelease == false) | .id
          ' "$RUNNER_TEMP/created-release.json")
          [[ "$release_id" =~ ^[0-9]+$ ]]
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"

      - name: Upload assets by captured release ID and capture both asset IDs
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          upload_asset() {
            local name=$1
            local output=$2
            curl --fail --silent --show-error --location \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@dist/$name" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              >"$output"
          }
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          upload_asset curl-provider.wasm "$RUNNER_TEMP/wasm-asset.json"
          upload_asset curl-provider.wasm.sha256 "$RUNNER_TEMP/checksum-asset.json"
          wasm_asset_id=$(jq -er 'select(.name == "curl-provider.wasm") | .id' \
            "$RUNNER_TEMP/wasm-asset.json")
          checksum_asset_id=$(jq -er 'select(.name == "curl-provider.wasm.sha256") | .id' \
            "$RUNNER_TEMP/checksum-asset.json")
          [[ "$wasm_asset_id" =~ ^[0-9]+$ ]]
          [[ "$checksum_asset_id" =~ ^[0-9]+$ ]]
          echo "wasm_asset_id=$wasm_asset_id" >>"$GITHUB_OUTPUT"
          echo "checksum_asset_id=$checksum_asset_id" >>"$GITHUB_OUTPUT"

      - name: Verify exact owned draft metadata and re-downloaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          WASM_ASSET_ID: ${{ steps.upload.outputs.wasm_asset_id }}
          CHECKSUM_ASSET_ID: ${{ steps.upload.outputs.checksum_asset_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/releases-after-create.json"
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson id "$RELEASE_ID" '
            [.[] | select(.tag_name == $tag) | .id] == [$id]
          ' "$RUNNER_TEMP/releases-after-create.json" >/dev/null
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --argjson release_id "$RELEASE_ID" \
            --argjson wasm_id "$WASM_ASSET_ID" \
            --argjson checksum_id "$CHECKSUM_ASSET_ID" '
              .id == $release_id and
              .tag_name == $tag and
              .draft == true and
              .prerelease == false and
              ([.assets[] | {name, id}] | sort_by(.name)) ==
                ([
                  {name: "curl-provider.wasm", id: $wasm_id},
                  {name: "curl-provider.wasm.sha256", id: $checksum_id}
                ] | sort_by(.name))
            ' <<<"$release" >/dev/null
          mkdir "$RUNNER_TEMP/draft-assets"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$WASM_ASSET_ID" \
            >"$RUNNER_TEMP/draft-assets/curl-provider.wasm"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$CHECKSUM_ASSET_ID" \
            >"$RUNNER_TEMP/draft-assets/curl-provider.wasm.sha256"
          (cd "$RUNNER_TEMP/draft-assets" && shasum -a 256 -c curl-provider.wasm.sha256)
          cmp dist/curl-provider.wasm "$RUNNER_TEMP/draft-assets/curl-provider.wasm"
          cmp dist/curl-provider.wasm.sha256 \
            "$RUNNER_TEMP/draft-assets/curl-provider.wasm.sha256"

  ghcr:
    name: Create, privately validate, then expose one OCI layer
    needs: [build, draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Read the exact draft by ID for package/release coordination.
      packages: write # Create and change visibility of the one owned GHCR package.
    outputs:
      prior_visibility: ${{ steps.preflight.outputs.prior_visibility }}
      manifest_digest: ${{ steps.layout.outputs.manifest_digest }}
      push_started: ${{ steps.state.outputs.push_started }}
      package_id: ${{ steps.capture.outputs.package_id }}
      package_version_id: ${{ steps.capture.outputs.package_version_id }}
      publicized: ${{ steps.publish.outputs.publicized }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified component
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-component
          path: dist
      - name: Verify bytes and the captured owned draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          (cd dist && shasum -a 256 -c curl-provider.wasm.sha256)
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e --arg tag "$GITHUB_REF_NAME" \
            '.tag_name == $tag and .draft == true and .prerelease == false' \
            <<<"$release" >/dev/null
      - name: Install checksum-pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          install -m 0755 "$RUNNER_TEMP/oras" "$RUNNER_TEMP/bin-oras"
      - name: Prove the v0.1.0 package is wholly absent before publication
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/package-before.json"
          status=$(curl --silent --show-error --location \
            --output "$body" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/$PACKAGE_ENDPOINT")
          case "$status" in
            404)
              echo 'prior_visibility=absent' >>"$GITHUB_OUTPUT"
              ;;
            200)
              visibility=$(jq -er '.visibility' "$body")
              echo "prior_visibility=$visibility" >>"$GITHUB_OUTPUT"
              echo "error: v0.1.0 requires a provably absent package; found $visibility" >&2
              exit 1
              ;;
            *)
              echo "error: package absence check returned HTTP $status" >&2
              cat "$body" >&2
              exit 1
              ;;
          esac
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and capture one immutable local OCI manifest
        id: layout
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          layout="$RUNNER_TEMP/oci-layout"
          (
            cd dist
            "$RUNNER_TEMP/bin-oras" push --oci-layout "$layout:$VERSION" \
              --artifact-type application/vnd.dekopon.provider.v1+wasm \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "dev.dekopon.release-run=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
              curl-provider.wasm:application/wasm
          )
          digest=$("$RUNNER_TEMP/bin-oras" resolve --oci-layout "$layout:$VERSION")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          "$RUNNER_TEMP/bin-oras" manifest fetch --oci-layout "$layout@$digest" \
            >"$RUNNER_TEMP/local-manifest.json"
          jq -e --arg layer "sha256:$EXPECTED_SHA" \
            --arg revision "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" '
              (.layers | length) == 1 and
              .layers[0].digest == $layer and
              .layers[0].mediaType == "application/wasm" and
              .layers[0].annotations["org.opencontainers.image.title"] == "curl-provider.wasm" and
              .annotations["org.opencontainers.image.revision"] == $revision and
              .annotations["dev.dekopon.release-run"] == $run
            ' "$RUNNER_TEMP/local-manifest.json" >/dev/null
          echo "manifest_digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Record immutable publication ownership before the remote copy
        id: state
        run: echo 'push_started=true' >>"$GITHUB_OUTPUT"
      - name: Copy the captured manifest to the previously absent package
        env:
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin-oras" cp --from-oci-layout \
            "$RUNNER_TEMP/oci-layout@$MANIFEST_DIGEST" "$OCI_REPOSITORY:$VERSION"
          [[ "$("$RUNNER_TEMP/bin-oras" resolve "$OCI_REPOSITORY:$VERSION")" == \
             "$MANIFEST_DIGEST" ]]
      - name: Capture IDs only after the exact private package version exists
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for _attempt in {1..12}; do
            if package=$(gh api "$PACKAGE_ENDPOINT" 2>/dev/null) && \
               gh api --paginate --slurp "$PACKAGE_ENDPOINT/versions?per_page=100" \
                 | jq 'add // []' >"$RUNNER_TEMP/versions.json"; then
              package_id=$(jq -er 'select(.visibility == "private") | .id' <<<"$package")
              count=$(jq 'length' "$RUNNER_TEMP/versions.json")
              version_id=$(jq -r --arg digest "$MANIFEST_DIGEST" --arg tag "$VERSION" '
                .[] | select(.name == $digest and .metadata.container.tags == [$tag]) | .id
              ' "$RUNNER_TEMP/versions.json")
              if [[ "$package_id" =~ ^[0-9]+$ && "$count" == 1 && \
                    "$version_id" =~ ^[0-9]+$ ]]; then
                echo "package_id=$package_id" >>"$GITHUB_OUTPUT"
                echo "package_version_id=$version_id" >>"$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'error: exact private package/version did not become observable' >&2
          exit 1
      - name: Verify private bytes, pinned manifest, and exact tag set
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$("$RUNNER_TEMP/bin-oras" resolve "$OCI_REPOSITORY:$VERSION")" == \
             "$MANIFEST_DIGEST" ]]
          "$RUNNER_TEMP/bin-oras" manifest fetch "$OCI_REPOSITORY@$MANIFEST_DIGEST" \
            >"$RUNNER_TEMP/remote-manifest.json"
          cmp "$RUNNER_TEMP/local-manifest.json" "$RUNNER_TEMP/remote-manifest.json"
          jq -e --arg digest "sha256:$EXPECTED_SHA" '
            (.layers | length) == 1 and
            .layers[0].digest == $digest and
            .layers[0].mediaType == "application/wasm" and
            .layers[0].annotations["org.opencontainers.image.title"] == "curl-provider.wasm"
          ' "$RUNNER_TEMP/remote-manifest.json" >/dev/null
          rm -rf "$RUNNER_TEMP/private-pull" && mkdir "$RUNNER_TEMP/private-pull"
          (cd "$RUNNER_TEMP/private-pull" && \
            "$RUNNER_TEMP/bin-oras" pull "$OCI_REPOSITORY@$MANIFEST_DIGEST")
          test "$(find "$RUNNER_TEMP/private-pull" -maxdepth 1 -type f | wc -l)" -eq 1
          cmp dist/curl-provider.wasm "$RUNNER_TEMP/private-pull/curl-provider.wasm"
          [[ "$("$RUNNER_TEMP/bin-oras" repo tags "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]
      - name: Make the validated package public last
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          PACKAGE_ID: ${{ steps.capture.outputs.package_id }}
          PACKAGE_VERSION_ID: ${{ steps.capture.outputs.package_version_id }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package=$(gh api "$PACKAGE_ENDPOINT")
          gh api --paginate --slurp "$PACKAGE_ENDPOINT/versions?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/versions-before-public.json"
          jq -e --argjson package_id "$PACKAGE_ID" '
            .id == $package_id and .visibility == "private"
          ' <<<"$package" >/dev/null
          jq -e --argjson id "$PACKAGE_VERSION_ID" \
            --arg digest "$MANIFEST_DIGEST" --arg tag "$VERSION" '
              length == 1 and
              .[0].id == $id and
              .[0].name == $digest and
              .[0].metadata.container.tags == [$tag]
            ' "$RUNNER_TEMP/versions-before-public.json" >/dev/null
          [[ "$("$RUNNER_TEMP/bin-oras" resolve "$OCI_REPOSITORY:$VERSION")" == \
             "$MANIFEST_DIGEST" ]]
          [[ "$("$RUNNER_TEMP/bin-oras" repo tags "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]
          gh api --method PATCH "$PACKAGE_ENDPOINT/visibility" \
            -f visibility=public >/dev/null
          [[ "$(gh api "$PACKAGE_ENDPOINT" --jq .visibility)" == public ]]
          echo 'publicized=true' >>"$GITHUB_OUTPUT"
      - name: Verify the now-public OCI artifact without credentials
        env:
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{"auths":{}}\n' >"$RUNNER_TEMP/anonymous-auth.json"
          anonymous=(--registry-config "$RUNNER_TEMP/anonymous-auth.json")
          [[ "$("$RUNNER_TEMP/bin-oras" resolve "${anonymous[@]}" \
              "$OCI_REPOSITORY:$VERSION")" == "$MANIFEST_DIGEST" ]]
          rm -rf "$RUNNER_TEMP/public-pull" && mkdir "$RUNNER_TEMP/public-pull"
          (cd "$RUNNER_TEMP/public-pull" && \
            "$RUNNER_TEMP/bin-oras" pull "${anonymous[@]}" \
              "$OCI_REPOSITORY@$MANIFEST_DIGEST")
          test "$(find "$RUNNER_TEMP/public-pull" -maxdepth 1 -type f | wc -l)" -eq 1
          cmp dist/curl-provider.wasm "$RUNNER_TEMP/public-pull/curl-provider.wasm"
          [[ "$("$RUNNER_TEMP/bin-oras" repo tags "${anonymous[@]}" \
              "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]

  finalize:
    name: Reverify immutable publication state, then finalize
    needs: [build, draft, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Read draft assets and change only the captured release.
      packages: read # Recheck the captured public package/version immediately before release.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out for the final release-ref check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified component
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-component
          path: dist
      - name: Install exact component and OCI tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RELEASE_RUST" --profile minimal
          cargo "+$RELEASE_RUST" install wasm-tools --version "$WASM_TOOLS_VERSION" --locked
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Re-download and verify everything immediately before publication
        env:
          CHECKSUM_ASSET_ID: ${{ needs.draft.outputs.checksum_asset_id }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
          PACKAGE_ID: ${{ needs.ghcr.outputs.package_id }}
          PACKAGE_VERSION_ID: ${{ needs.ghcr.outputs.package_version_id }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          VERSION: ${{ needs.build.outputs.version }}
          WASM_ASSET_ID: ${{ needs.draft.outputs.wasm_asset_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$WASM_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$CHECKSUM_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PACKAGE_ID" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE_VERSION_ID" =~ ^[0-9]+$ ]]
          (cd dist && shasum -a 256 -c curl-provider.wasm.sha256)
          [[ "$(awk '{print $1}' dist/curl-provider.wasm.sha256)" == "$EXPECTED_SHA" ]]

          # The annotated tag and main are mutable server state, so peel both again now.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --argjson release_id "$RELEASE_ID" \
            --argjson wasm_id "$WASM_ASSET_ID" \
            --argjson checksum_id "$CHECKSUM_ASSET_ID" '
              .id == $release_id and
              .tag_name == $tag and
              .draft == true and
              .prerelease == false and
              ([.assets[] | {name, id}] | sort_by(.name)) ==
                ([
                  {name: "curl-provider.wasm", id: $wasm_id},
                  {name: "curl-provider.wasm.sha256", id: $checksum_id}
                ] | sort_by(.name))
            ' <<<"$release" >/dev/null

          rm -rf "$RUNNER_TEMP/prepublish" && mkdir "$RUNNER_TEMP/prepublish"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$WASM_ASSET_ID" \
            >"$RUNNER_TEMP/prepublish/curl-provider.wasm"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$CHECKSUM_ASSET_ID" \
            >"$RUNNER_TEMP/prepublish/curl-provider.wasm.sha256"
          (cd "$RUNNER_TEMP/prepublish" && shasum -a 256 -c curl-provider.wasm.sha256)
          [[ "$(awk '{print $1}' "$RUNNER_TEMP/prepublish/curl-provider.wasm.sha256")" == \
             "$EXPECTED_SHA" ]]
          cmp dist/curl-provider.wasm "$RUNNER_TEMP/prepublish/curl-provider.wasm"
          cmp dist/curl-provider.wasm.sha256 \
            "$RUNNER_TEMP/prepublish/curl-provider.wasm.sha256"

          # Attestations and GHCR are public before release publication; verify them anonymously and
          # bind both attestations to this exact source commit as well as this tag ref.
          env -u GH_TOKEN -u GITHUB_TOKEN gh attestation verify \
            "$RUNNER_TEMP/prepublish/curl-provider.wasm" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type 'https://slsa.dev/provenance/v1' \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" >/dev/null
          env -u GH_TOKEN -u GITHUB_TOKEN gh attestation verify \
            "$RUNNER_TEMP/prepublish/curl-provider.wasm" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type 'https://cyclonedx.org/bom' \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" >/dev/null

          wasm-tools component wit --json "$RUNNER_TEMP/prepublish/curl-provider.wasm" \
            >"$RUNNER_TEMP/wit.json"
          wasm-tools component wit "$RUNNER_TEMP/prepublish/curl-provider.wasm" \
            >"$RUNNER_TEMP/component.wit"
          jq -e '
            (.worlds | length) == 1 and
            (.interfaces | length) == 1 and
            (.worlds[0].exports | keys | sort) == ["describe", "invoke", "resolve-command"] and
            (.worlds[0].imports | length) == 1 and
            .packages[.interfaces[0].package].name == "dekopon:http@1.0.0" and
            .interfaces[0].name == "client" and
            (.interfaces[0].functions | keys) == ["send"] and
            ([.packages[].name] | sort) == ["dekopon:http@1.0.0", "root:component"]
          ' "$RUNNER_TEMP/wit.json" >/dev/null
          if grep -Eqi 'wasi:|wasix|wasi_snapshot|wasm-bindgen|js-sys' \
            "$RUNNER_TEMP/component.wit"; then
            echo 'error: ambient interface/runtime found in component' >&2
            exit 1
          fi

          printf '{"auths":{}}\n' >"$RUNNER_TEMP/anonymous-auth.json"
          anonymous=(--registry-config "$RUNNER_TEMP/anonymous-auth.json")
          [[ "$("$RUNNER_TEMP/oras" resolve "${anonymous[@]}" \
              "$OCI_REPOSITORY:$VERSION")" == "$MANIFEST_DIGEST" ]]
          "$RUNNER_TEMP/oras" manifest fetch "${anonymous[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST" >"$RUNNER_TEMP/manifest.json"
          jq -e --arg digest "sha256:$EXPECTED_SHA" '
            (.layers | length) == 1 and
            .layers[0].digest == $digest and
            .layers[0].mediaType == "application/wasm" and
            .layers[0].annotations["org.opencontainers.image.title"] == "curl-provider.wasm"
          ' "$RUNNER_TEMP/manifest.json" >/dev/null
          rm -rf "$RUNNER_TEMP/oci" && mkdir "$RUNNER_TEMP/oci"
          (cd "$RUNNER_TEMP/oci" && "$RUNNER_TEMP/oras" pull "${anonymous[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST")
          test "$(find "$RUNNER_TEMP/oci" -maxdepth 1 -type f | wc -l)" -eq 1
          cmp "$RUNNER_TEMP/prepublish/curl-provider.wasm" \
            "$RUNNER_TEMP/oci/curl-provider.wasm"
          [[ "$("$RUNNER_TEMP/oras" repo tags "${anonymous[@]}" \
              "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]

          # Recheck every mutable pointer immediately before the only publication mutation.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]
          [[ "$("$RUNNER_TEMP/oras" resolve "${anonymous[@]}" \
              "$OCI_REPOSITORY:$VERSION")" == "$MANIFEST_DIGEST" ]]
          package=$(gh api "$PACKAGE_ENDPOINT")
          gh api --paginate --slurp "$PACKAGE_ENDPOINT/versions?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/versions-before-finalize.json"
          jq -e --argjson package_id "$PACKAGE_ID" '
            .id == $package_id and .visibility == "public"
          ' <<<"$package" >/dev/null
          jq -e --argjson id "$PACKAGE_VERSION_ID" \
            --arg digest "$MANIFEST_DIGEST" --arg tag "$VERSION" '
              length == 1 and
              .[0].id == $id and
              .[0].name == $digest and
              .[0].metadata.container.tags == [$tag]
            ' "$RUNNER_TEMP/versions-before-finalize.json" >/dev/null
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/releases-before-finalize.json"
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson id "$RELEASE_ID" '
            [.[] | select(.tag_name == $tag) | .id] == [$id]
          ' "$RUNNER_TEMP/releases-before-finalize.json" >/dev/null
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --argjson wasm_id "$WASM_ASSET_ID" \
            --argjson checksum_id "$CHECKSUM_ASSET_ID" '
              .tag_name == $tag and .draft == true and .prerelease == false and
              ([.assets[] | {name, id}] | sort_by(.name)) ==
                ([
                  {name: "curl-provider.wasm", id: $wasm_id},
                  {name: "curl-provider.wasm.sha256", id: $checksum_id}
                ] | sort_by(.name))
            ' <<<"$current" >/dev/null

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=false >"$RUNNER_TEMP/published.json"
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson id "$RELEASE_ID" '
            .id == $id and .tag_name == $tag and .draft == false and .prerelease == false
          ' "$RUNNER_TEMP/published.json" >/dev/null
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          jq -e --argjson id "$RELEASE_ID" \
            '.id == $id and .draft == false and .prerelease == false' \
            <<<"$published" >/dev/null

  anonymous-verify:
    name: Anonymous public verification
    needs: [build, draft, ghcr, finalize]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install exact public verification tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RELEASE_RUST" --profile minimal
          cargo "+$RELEASE_RUST" install wasm-tools --version "$WASM_TOOLS_VERSION" --locked
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Download and verify release, attestations, WIT, and OCI anonymously
        env:
          CHECKSUM_ASSET_ID: ${{ needs.draft.outputs.checksum_asset_id }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
          MANIFEST_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          VERSION: ${{ needs.build.outputs.version }}
          WASM_ASSET_ID: ${{ needs.draft.outputs.wasm_asset_id }}
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          base="https://github.com/dekopon-agents/dekopon-provider-curl/releases/download/v$VERSION"
          mkdir "$RUNNER_TEMP/release"
          curl --fail --silent --show-error --location \
            "$base/curl-provider.wasm" -o "$RUNNER_TEMP/release/curl-provider.wasm"
          curl --fail --silent --show-error --location \
            "$base/curl-provider.wasm.sha256" \
            -o "$RUNNER_TEMP/release/curl-provider.wasm.sha256"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 -c curl-provider.wasm.sha256)
          [[ "$(awk '{print $1}' "$RUNNER_TEMP/release/curl-provider.wasm.sha256")" == \
             "$EXPECTED_SHA" ]]
          release=$(curl --fail --silent --show-error \
            "https://api.github.com/repos/dekopon-agents/dekopon-provider-curl/releases/tags/v$VERSION")
          jq -e \
            --argjson release_id "$RELEASE_ID" \
            --argjson wasm_id "$WASM_ASSET_ID" \
            --argjson checksum_id "$CHECKSUM_ASSET_ID" '
              .id == $release_id and .draft == false and .prerelease == false and
              ([.assets[] | {name, id}] | sort_by(.name)) ==
                ([
                  {name: "curl-provider.wasm", id: $wasm_id},
                  {name: "curl-provider.wasm.sha256", id: $checksum_id}
                ] | sort_by(.name))
            ' <<<"$release" >/dev/null
          gh attestation verify "$RUNNER_TEMP/release/curl-provider.wasm" \
            --repo dekopon-agents/dekopon-provider-curl \
            --predicate-type 'https://slsa.dev/provenance/v1' \
            --signer-workflow dekopon-agents/dekopon-provider-curl/.github/workflows/release.yml \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" >/dev/null
          gh attestation verify "$RUNNER_TEMP/release/curl-provider.wasm" \
            --repo dekopon-agents/dekopon-provider-curl \
            --predicate-type 'https://cyclonedx.org/bom' \
            --signer-workflow dekopon-agents/dekopon-provider-curl/.github/workflows/release.yml \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" >/dev/null
          wasm-tools component wit --json "$RUNNER_TEMP/release/curl-provider.wasm" \
            >"$RUNNER_TEMP/wit.json"
          wasm-tools component wit "$RUNNER_TEMP/release/curl-provider.wasm" \
            >"$RUNNER_TEMP/component.wit"
          jq -e '
            (.worlds | length) == 1 and
            (.interfaces | length) == 1 and
            (.worlds[0].exports | keys | sort) == ["describe", "invoke", "resolve-command"] and
            (.worlds[0].imports | length) == 1 and
            .packages[.interfaces[0].package].name == "dekopon:http@1.0.0" and
            .interfaces[0].name == "client" and
            (.interfaces[0].functions | keys) == ["send"] and
            ([.packages[].name] | sort) == ["dekopon:http@1.0.0", "root:component"]
          ' "$RUNNER_TEMP/wit.json" >/dev/null
          if grep -Eqi 'wasi:|wasix|wasi_snapshot|wasm-bindgen|js-sys' \
            "$RUNNER_TEMP/component.wit"; then
            echo 'error: ambient interface/runtime found in component' >&2
            exit 1
          fi
          printf '{"auths":{}}\n' >"$RUNNER_TEMP/anonymous-auth.json"
          anonymous=(--registry-config "$RUNNER_TEMP/anonymous-auth.json")
          [[ "$("$RUNNER_TEMP/oras" resolve "${anonymous[@]}" \
              "$OCI_REPOSITORY:$VERSION")" == "$MANIFEST_DIGEST" ]]
          mkdir "$RUNNER_TEMP/oci"
          (cd "$RUNNER_TEMP/oci" && "$RUNNER_TEMP/oras" pull "${anonymous[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST")
          test "$(find "$RUNNER_TEMP/oci" -maxdepth 1 -type f | wc -l)" -eq 1
          cmp "$RUNNER_TEMP/release/curl-provider.wasm" \
            "$RUNNER_TEMP/oci/curl-provider.wasm"
          "$RUNNER_TEMP/oras" manifest fetch "${anonymous[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST" >"$RUNNER_TEMP/manifest.json"
          jq -e --arg digest "sha256:$EXPECTED_SHA" '
            (.layers | length) == 1 and
            .layers[0].digest == $digest and
            .layers[0].mediaType == "application/wasm" and
            .layers[0].annotations["org.opencontainers.image.title"] == "curl-provider.wasm"
          ' "$RUNNER_TEMP/manifest.json" >/dev/null
          [[ "$("$RUNNER_TEMP/oras" repo tags "${anonymous[@]}" \
              "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]

  cleanup:
    name: Roll back only immutable state owned by a failed or cancelled run
    needs: [build, attest, draft, ghcr, finalize, anonymous-verify]
    if: >-
      ${{ always() &&
          (contains(needs.*.result, 'failure') ||
           contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Delete the captured draft or finalized release.
      packages: write # Restore privacy and delete the captured package version.
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
      PACKAGE_ID: ${{ needs.ghcr.outputs.package_id }}
      PACKAGE_VERSION_ID: ${{ needs.ghcr.outputs.package_version_id }}
      PRIOR_VISIBILITY: ${{ needs.ghcr.outputs.prior_visibility }}
      PUSH_STARTED: ${{ needs.ghcr.outputs.push_started }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - name: Restore absence without mutable tag lookups and surface every cleanup error
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          api="$GITHUB_API_URL"
          headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          request() {
            local method=$1
            local endpoint=$2
            local output=$3
            local data=${4-}
            local status
            local args=(--silent --show-error --location --request "$method" \
              "${headers[@]}" --output "$output" --write-out '%{http_code}')
            if [[ -n "$data" ]]; then
              args+=(--header 'Content-Type: application/json' --data "$data")
            fi
            if ! status=$(curl "${args[@]}" "$api/$endpoint"); then
              echo "error: cleanup API request failed: $method $endpoint" >&2
              failures=$((failures + 1))
              printf '000'
              return
            fi
            printf '%s' "$status"
          }

          package_present=false
          current_package_id=
          if [[ "$PUSH_STARTED" == true || -n "$PACKAGE_VERSION_ID" ]]; then
            if [[ "$PRIOR_VISIBILITY" != absent ]]; then
              echo 'error: refusing package cleanup without captured prior absence' >&2
              failures=$((failures + 1))
            elif [[ ! "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo 'error: refusing package cleanup without an immutable manifest digest' >&2
              failures=$((failures + 1))
            else
              status=$(request GET "$PACKAGE_ENDPOINT" "$RUNNER_TEMP/package.json")
              case "$status" in
                200)
                  package_present=true
                  current_package_id=$(jq -er '.id' "$RUNNER_TEMP/package.json") || {
                    echo 'error: cleanup could not read package ID' >&2
                    failures=$((failures + 1))
                  }
                  if [[ -n "$PACKAGE_ID" && "$current_package_id" != "$PACKAGE_ID" ]]; then
                    echo 'error: current package ID differs from the captured owned ID' >&2
                    failures=$((failures + 1))
                    package_present=false
                  else
                    # Hide public bytes before deleting anything; the captured prior state was absent.
                    status=$(request PATCH "$PACKAGE_ENDPOINT/visibility" \
                      "$RUNNER_TEMP/package-private.json" '{"visibility":"private"}')
                    if [[ "$status" != 200 && "$status" != 204 ]]; then
                      echo "error: restoring package privacy returned HTTP $status" >&2
                      failures=$((failures + 1))
                      # Still attempt deletion by captured immutable digest to minimize exposure.
                    fi
                  fi
                  ;;
                404) ;;
                *)
                  echo "error: package cleanup discovery returned HTTP $status" >&2
                  failures=$((failures + 1))
                  ;;
              esac
            fi
          fi

          # Delete the exact release ID created by this run, whether it is still draft or finalized.
          if [[ -n "$RELEASE_ID" ]]; then
            if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
              echo 'error: captured release ID is invalid' >&2
              failures=$((failures + 1))
            else
              status=$(request GET "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                "$RUNNER_TEMP/release.json")
              case "$status" in
                200)
                  if [[ "$(jq -r '.tag_name' "$RUNNER_TEMP/release.json")" != \
                        "$GITHUB_REF_NAME" ]]; then
                    echo 'error: captured release ID was mutated to a different tag' >&2
                    failures=$((failures + 1))
                  fi
                  # The immutable captured ID, not the mutable tag, establishes ownership.
                  status=$(request DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                    "$RUNNER_TEMP/release-delete.json")
                  if [[ "$status" != 204 && "$status" != 404 ]]; then
                    echo "error: release deletion returned HTTP $status" >&2
                    failures=$((failures + 1))
                  fi
                  ;;
                404) ;;
                *)
                  echo "error: release cleanup discovery returned HTTP $status" >&2
                  failures=$((failures + 1))
                  ;;
              esac
            fi
          fi

          if [[ "$package_present" == true ]]; then
            status=$(request GET "$PACKAGE_ENDPOINT/versions?per_page=100" \
              "$RUNNER_TEMP/versions.json")
            if [[ "$status" != 200 ]]; then
              echo "error: package version discovery returned HTTP $status" >&2
              failures=$((failures + 1))
            else
              owned_id=$PACKAGE_VERSION_ID
              if [[ -n "$owned_id" ]]; then
                match=$(jq --argjson id "$owned_id" --arg digest "$MANIFEST_DIGEST" \
                  '[.[] | select(.id == $id and .name == $digest)] | length' \
                  "$RUNNER_TEMP/versions.json")
                if [[ "$match" != 1 ]]; then
                  echo 'error: captured package version ID/digest ownership no longer matches' >&2
                  failures=$((failures + 1))
                  owned_id=
                fi
              else
                matches=$(jq --arg digest "$MANIFEST_DIGEST" \
                  '[.[] | select(.name == $digest)]' "$RUNNER_TEMP/versions.json")
                if [[ "$(jq 'length' <<<"$matches")" == 1 ]]; then
                  owned_id=$(jq -r '.[0].id' <<<"$matches")
                elif [[ "$(jq 'length' <<<"$matches")" != 0 ]]; then
                  echo 'error: immutable manifest digest maps to multiple package versions' >&2
                  failures=$((failures + 1))
                fi
              fi
              if [[ -n "$owned_id" ]]; then
                if [[ ! "$owned_id" =~ ^[0-9]+$ ]]; then
                  echo 'error: owned package version ID is invalid' >&2
                  failures=$((failures + 1))
                else
                  status=$(request DELETE "$PACKAGE_ENDPOINT/versions/$owned_id" \
                    "$RUNNER_TEMP/version-delete.json")
                  if [[ "$status" != 204 && "$status" != 404 ]]; then
                    echo "error: package version deletion returned HTTP $status" >&2
                    failures=$((failures + 1))
                  fi
                fi
              fi
            fi

            restored=false
            for _cleanup_attempt in {1..6}; do
              status=$(request GET "$PACKAGE_ENDPOINT" "$RUNNER_TEMP/package-after.json")
              case "$status" in
                404)
                  restored=true
                  break
                  ;;
                200)
                  status=$(request GET "$PACKAGE_ENDPOINT/versions?per_page=100" \
                    "$RUNNER_TEMP/versions-after.json")
                  if [[ "$status" != 200 ]]; then
                    echo "error: final package version discovery returned HTTP $status" >&2
                    failures=$((failures + 1))
                    break
                  fi
                  remaining=$(jq 'length' "$RUNNER_TEMP/versions-after.json")
                  non_owned=$(jq --arg digest "$MANIFEST_DIGEST" \
                    '[.[] | select(.name != $digest)] | length' \
                    "$RUNNER_TEMP/versions-after.json")
                  if [[ "$non_owned" != 0 ]]; then
                    echo 'error: package still has non-owned versions; left private, not deleted' >&2
                    failures=$((failures + 1))
                    break
                  fi
                  if [[ "$remaining" == 0 ]]; then
                    status=$(request DELETE "$PACKAGE_ENDPOINT" \
                      "$RUNNER_TEMP/package-delete.json")
                    if [[ "$status" == 404 ]]; then
                      restored=true
                      break
                    elif [[ "$status" != 204 ]]; then
                      echo "error: empty package deletion returned HTTP $status" >&2
                      failures=$((failures + 1))
                      break
                    fi
                  fi
                  # A deleted version/package can remain briefly observable; retry within a bound.
                  sleep 5
                  ;;
                *)
                  echo "error: package absence verification returned HTTP $status" >&2
                  failures=$((failures + 1))
                  break
                  ;;
              esac
            done
            if [[ "$restored" != true ]]; then
              echo 'error: initially absent package did not become absent after rollback' >&2
              failures=$((failures + 1))
            fi
          fi

          if ((failures != 0)); then
            echo "error: rollback completed with $failures surfaced failure(s)" >&2
            exit 1
          fi
          echo 'rollback verified: captured release/package state is absent'
